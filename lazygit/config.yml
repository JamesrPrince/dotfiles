# lazygit: named ANSI colours only, so the panel colours follow the terminal theme.
gui:
  theme:
    activeBorderColor: [cyan, bold]
    inactiveBorderColor: [default]
    searchingActiveBorderColor: [yellow, bold]
    optionsTextColor: [blue]
    selectedLineBgColor: [reverse]
    inactiveViewSelectedLineBgColor: [bold]
    cherryPickedCommitFgColor: [blue]
    cherryPickedCommitBgColor: [cyan]
    markedBaseCommitFgColor: [blue]
    unstagedChangesColor: [red]
    defaultFgColor: [default]
# delta renders the diffs (side-by-side off here: lazygit's panel is too narrow)
git:
  diffRenderers:
    - colorArg: always
      command: delta --paging=never --no-gitconfig --line-numbers --syntax-theme=ansi
