#!/bin/bash
# Workspace labels and visibility: edit here, then `sketchybar --reload`.
# Sourced by items/spaces.sh and plugins/spaces.sh.

# "<workspace>:<name>" pairs, space separated, one word per name.
# A workspace with no entry shows its number only.
WORKSPACE_NAMES="1:Web 2:Code 3:Notes 4:Office 5:Chat"

# Workspaces that never get a pill on the bar (the AeroSpace scratchpad).
HIDDEN_WORKSPACES="S"

# workspace_label <id>  ->  "1 Web", or just "6" when it has no name
workspace_label() {
  local pair
  for pair in $WORKSPACE_NAMES; do
    [ "${pair%%:*}" = "$1" ] && { echo "$1 ${pair#*:}"; return; }
  done
  echo "$1"
}

# visible_workspaces  ->  every AeroSpace workspace except the hidden ones
visible_workspaces() {
  local sid hidden
  for sid in $(/usr/local/bin/aerospace list-workspaces --all); do
    for hidden in $HIDDEN_WORKSPACES; do
      [ "$sid" = "$hidden" ] && continue 2
    done
    echo "$sid"
  done
}
