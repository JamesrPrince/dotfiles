# Trading windows for the flat bar's market item (plugins/market.sh). This file only applies when
# FLAT_MARKET_ALWAYS=0 in plugins/flat_config.sh; with 1 (the default) the item is always shown and these
# patterns are not read. With 0 the item shows, and prices are fetched, only while a window matching one
# of these is open (on any workspace). One pattern per line,
# case-insensitive, matched as plain text anywhere in "<app name>|<window title>". Blank lines and
# # comments are ignored. The symbols themselves are listed in market.conf.
# Only the front tab of a browser window has its title visible, so a TradingView tab behind another
# tab is not seen until it is brought to the front.
Exness
TradingView
BTC Bid
XAU
