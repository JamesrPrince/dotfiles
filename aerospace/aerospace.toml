# AeroSpace config (based on the bundled default-config.toml, v0.21.3)
# Reference: https://nikitabobko.github.io/AeroSpace/guide

config-version = 2

# SketchyBar starts with AeroSpace, so the bar always has a server to query
after-startup-command = [
    'exec-and-forget /usr/local/bin/sketchybar',
    # Highlight border on the focused window (JankyBorders), in the bar theme's accent
    'exec-and-forget /bin/bash ~/.config/sketchybar/plugins/theme.sh borders'
]

# Tell SketchyBar which workspace is focused
exec-on-workspace-change = ['/bin/bash', '-c',
    '/usr/local/bin/sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE'
]

# Refresh the workspace app icons and the layout pill when windows open, close or move.
# Its own event, so a workspace switch is not counted twice (spaces.sh skips unchanged states)
# The pointer follows keyboard focus; window-lazy-center only moves it when it is outside
# the newly focused window, so clicking a window never makes it jump.
on-focus-changed = [
    'exec-and-forget /usr/local/bin/sketchybar --trigger aerospace_focus_change',
    'move-mouse window-lazy-center'
]

start-at-login = true
auto-reload-config = true

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 30
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

automatically-unhide-macos-hidden-apps = false

# Numbered workspaces only: alt-<letter> stays free for typing accents and symbols
persistent-workspaces = ["1", "2", "3", "4", "5"]

# Tell SketchyBar which mode is on (the pill next to the workspaces)
on-mode-changed = ['exec-and-forget /usr/local/bin/sketchybar --trigger aerospace_mode_change MODE=$(/usr/local/bin/aerospace list-modes --current)']
focus-follows-mouse.enabled = false
key-mapping.preset = 'qwerty'

# outer.top leaves room for the 39px SketchyBar (10px y_offset) at the top
gaps.inner.horizontal = 8
gaps.inner.vertical =   8
gaps.outer.left =       8
gaps.outer.bottom =     8
gaps.outer.top =        36
gaps.outer.right =      8

# Windows that should float instead of tiling
[[on-window-detected]]
    if.app-id = 'com.apple.systempreferences'
    run = 'layout floating'

[[on-window-detected]]
    if.app-id = 'com.apple.calculator'
    run = 'layout floating'

[[on-window-detected]]
    if.app-id = 'com.apple.ActivityMonitor'
    run = 'layout floating'

[[on-window-detected]]
    if.app-id = 'com.apple.archiveutility'
    run = 'layout floating'

[[on-window-detected]]
    if.app-id = 'com.apple.finder'
    if.window-title-regex-substring = ' Info$'
    run = 'layout floating'

# Finder transient dialogs: copy/move progress, Connect to Server, alerts.
# First match wins, so these sit above the tiling rule.
[[on-window-detected]]
    if.app-id = 'com.apple.finder'
    if.window-title-regex-substring = '^(Copy|Move|Connect to Server|Delete|Empty Trash|Alias|Compress|Duplicate|Verifying|Preparing|Connecting)'
    run = 'layout floating'

# Quick Look (Space bar) is a Finder window titled "Quick Look" (checked 2026-11-06);
# without this the tiling rule below catches it and reflows the workspace
[[on-window-detected]]
    if.app-id = 'com.apple.finder'
    if.window-title-regex-substring = '^(Quick Look|Finder Settings)$'
    run = 'layout floating'  # macOS centres the panel itself once it floats

# Quick Look helpers (Space-bar preview is often the filename, not "Quick Look").
# First-match-wins: these must sit before the Finder catch-all.
[[on-window-detected]]
    if.app-id = 'com.apple.quicklook.ui.helper'
    run = 'layout floating'

[[on-window-detected]]
    if.app-id = 'com.apple.QuickLookDaemon'
    run = 'layout floating'

[[on-window-detected]]
    if.app-id = 'com.apple.quicklook.qlmanage'
    run = 'layout floating'

# Every other Finder window floats first; the helper tiles only the browser windows,
# so a Quick Look titled with the filename never reflows the workspace.
[[on-window-detected]]
    if.app-id = 'com.apple.finder'
    run = ['layout floating', 'exec-and-forget ~/dotfiles/aerospace/finder-on-detect.sh']

[[on-window-detected]]
    if.app-id = 'com.apple.SystemProfiler'
    run = 'layout floating'

[[on-window-detected]]
    if.app-id = 'com.apple.DiskUtility'
    run = 'layout floating'

[[on-window-detected]]
    if.app-id = 'com.apple.FaceTime'
    run = 'layout floating'

# Picture in Picture: the system PiP (Safari, TV, FaceTime) and browser PiP windows
[[on-window-detected]]
    if.app-id = 'com.apple.PIPAgent'
    run = 'layout floating'

[[on-window-detected]]
    if.window-title-regex-substring = '(?i)^picture[- ]in[- ]picture$'
    run = 'layout floating'

# Screenshot toolbar (cmd-shift-5)
[[on-window-detected]]
    if.app-id = 'com.apple.screencaptureui'
    run = 'layout floating'

# 1Password: Quick Access popup and the vault window both float
[[on-window-detected]]
    if.app-id = 'com.1password.1password'
    run = 'layout floating'

[[on-window-detected]]
    if.app-id = 'com.wiheads.paste'
    run = 'layout floating'

[[on-window-detected]]
    if.app-id = 'io.tailscale.ipn.macsys'
    run = 'layout floating'

[[on-window-detected]]
    if.app-id = 'com.electron.ollama'
    run = 'layout floating'

# Apps that always open on their own workspace (new windows only)
# 1 browser, 2 terminal and Claude, 3 notes, 4 work (spreadsheets, mail), 5 chat and music
# Ghostty native tabs are extra AX windows (AeroSpace #68; ghostty.org/docs/help/macos-tiling-wms).
# Primary tiles on workspace 2; extra tabs float. The quick terminal is floated in place
# (not moved to 2); if size/dialog detection misses it, extras still float on the current workspace.
[[on-window-detected]]
    if.app-id = 'com.mitchellh.ghostty'
    run = ['layout floating', 'exec-and-forget ~/dotfiles/aerospace/ghostty-on-detect.sh']

# Settings and Preferences windows float. Placed after the Finder and Ghostty rules above
# (first match wins: those need their own handling), and before the workspace rules below,
# so a Settings window opens floating where you are instead of being moved and tiled.
[[on-window-detected]]
    if.window-title-regex-substring = '(?i)(settings|preferences)$'
    run = 'layout floating'

[[on-window-detected]]
    if.app-id = 'com.brave.Browser'
    run = 'move-node-to-workspace 1'

[[on-window-detected]]
    if.app-id = 'com.apple.Safari'
    run = 'move-node-to-workspace 1'

[[on-window-detected]]
    if.app-id = 'com.anthropic.claudefordesktop'
    run = 'move-node-to-workspace 2'

[[on-window-detected]]
    if.app-id = 'app.clarity.mac'
    run = 'move-node-to-workspace 2'

[[on-window-detected]]
    if.app-id = 'online.omniroute.desktop'
    run = 'move-node-to-workspace 2'

[[on-window-detected]]
    if.app-id = 'com.microsoft.VSCodeInsiders'
    run = 'move-node-to-workspace 2'

[[on-window-detected]]
    if.app-id = 'dev.warp.Warp-Stable'
    run = 'move-node-to-workspace 2'

[[on-window-detected]]
    if.app-id = 'notion.id'
    run = 'move-node-to-workspace 3'

[[on-window-detected]]
    if.app-id = 'com.apple.TextEdit'
    run = 'move-node-to-workspace 3'

[[on-window-detected]]
    if.app-id = 'com.microsoft.Excel'
    run = 'move-node-to-workspace 4'

[[on-window-detected]]
    if.app-id = 'com.microsoft.Outlook'
    run = 'move-node-to-workspace 4'

[[on-window-detected]]
    if.app-id = 'com.apple.mail'
    run = 'move-node-to-workspace 4'

[[on-window-detected]]
    if.app-id = 'org.libreoffice.script'
    run = 'move-node-to-workspace 4'

[[on-window-detected]]
    if.app-id = 'com.apple.Preview'
    run = 'move-node-to-workspace 4'

[[on-window-detected]]
    if.app-id = 'net.whatsapp.WhatsApp'
    run = 'move-node-to-workspace 5'

[[on-window-detected]]
    if.app-id = 'ru.keepcoder.Telegram'
    run = 'move-node-to-workspace 5'

[[on-window-detected]]
    if.app-id = 'com.tinyspeck.slackmacgap'
    run = 'move-node-to-workspace 5'

[[on-window-detected]]
    if.app-id = 'com.spotify.client'
    run = 'move-node-to-workspace 5'

[[on-window-detected]]
    if.app-id = 'com.colliderli.iina'
    run = 'move-node-to-workspace 5'

[mode.main.binding]
    # The layout pill in the bar follows these
    alt-slash = ['layout tiles horizontal vertical', 'exec-and-forget /usr/local/bin/sketchybar --trigger aerospace_layout_change']
    alt-comma = ['layout accordion horizontal vertical', 'exec-and-forget /usr/local/bin/sketchybar --trigger aerospace_layout_change']

    alt-h = 'focus left'
    alt-j = 'focus down'
    alt-k = 'focus up'
    alt-l = 'focus right'

    alt-shift-h = 'move left'
    alt-shift-j = 'move down'
    alt-shift-k = 'move up'
    alt-shift-l = 'move right'

    # Swap the focused window with its neighbour
    ctrl-alt-shift-h = ['swap left', 'exec-and-forget /usr/local/bin/sketchybar --trigger aerospace_layout_change'] # swap left
    ctrl-alt-shift-j = ['swap down', 'exec-and-forget /usr/local/bin/sketchybar --trigger aerospace_layout_change'] # swap down
    ctrl-alt-shift-k = ['swap up', 'exec-and-forget /usr/local/bin/sketchybar --trigger aerospace_layout_change'] # swap up
    ctrl-alt-shift-l = ['swap right', 'exec-and-forget /usr/local/bin/sketchybar --trigger aerospace_layout_change'] # swap right

    # Scratchpad: hidden workspace S
    alt-shift-minus = 'exec-and-forget ~/dotfiles/aerospace/scratchpad.sh send' # send window to scratchpad
    alt-shift-equal = 'exec-and-forget ~/dotfiles/aerospace/scratchpad.sh bring' # bring back last scratchpad window, floating

    alt-minus = 'resize smart -50'
    alt-equal = 'resize smart +50'

    # Toggle the focused window between floating and tiling
    alt-shift-space = ['layout floating tiling', 'exec-and-forget /usr/local/bin/sketchybar --trigger aerospace_layout_change']

    # The layout pill's script also hides the bar while a window is full screen
    alt-shift-f = ['fullscreen', 'exec-and-forget /usr/local/bin/sketchybar --trigger aerospace_layout_change']

    alt-1 = 'workspace 1'
    alt-2 = 'workspace 2'
    alt-3 = 'workspace 3'
    alt-4 = 'workspace 4'
    alt-5 = 'workspace 5'

    # The trigger refreshes the icons even when the move leaves no window to focus
    alt-shift-1 = ['move-node-to-workspace 1', 'exec-and-forget /usr/local/bin/sketchybar --trigger aerospace_focus_change']
    alt-shift-2 = ['move-node-to-workspace 2', 'exec-and-forget /usr/local/bin/sketchybar --trigger aerospace_focus_change']
    alt-shift-3 = ['move-node-to-workspace 3', 'exec-and-forget /usr/local/bin/sketchybar --trigger aerospace_focus_change']
    alt-shift-4 = ['move-node-to-workspace 4', 'exec-and-forget /usr/local/bin/sketchybar --trigger aerospace_focus_change']
    alt-shift-5 = ['move-node-to-workspace 5', 'exec-and-forget /usr/local/bin/sketchybar --trigger aerospace_focus_change']

    # Take the window along: move it and follow to that workspace
    ctrl-alt-shift-1 = 'move-node-to-workspace --focus-follows-window 1'
    ctrl-alt-shift-2 = 'move-node-to-workspace --focus-follows-window 2'
    ctrl-alt-shift-3 = 'move-node-to-workspace --focus-follows-window 3'
    ctrl-alt-shift-4 = 'move-node-to-workspace --focus-follows-window 4'
    ctrl-alt-shift-5 = 'move-node-to-workspace --focus-follows-window 5'

    # Cycle through the windows in this workspace, wrapping at the end
    alt-backtick = 'focus --boundaries-action wrap-around-the-workspace dfs-next'
    alt-shift-backtick = 'focus --boundaries-action wrap-around-the-workspace dfs-prev'

    alt-tab = 'workspace-back-and-forth'

    # Caps Lock is F18 (launchd/dev.dotfiles.capslock-f18.plist): tap it, then a letter (mode launch below)
    f18 = 'mode launch'

    alt-shift-semicolon = 'mode service'
    alt-shift-r = 'mode resize'

    # Key-binding cheat sheet (SketchyBar popup, built from this file)
    alt-shift-slash = 'exec-and-forget /usr/bin/python3 ~/.config/sketchybar/plugins/keys.py toggle'

    # Next theme: bar, borders, Ghostty, Neovim and wallpaper switch together (theme.sh set <name> picks one)
    alt-shift-t = 'exec-and-forget /bin/bash ~/.config/sketchybar/plugins/theme.sh next'

    # Next bar style (barstyle.sh, flat or floating)
    alt-shift-b = 'exec-and-forget /bin/bash ~/.config/sketchybar/plugins/barstyle.sh next'

    # App launchers: ctrl-alt-<letter> opens or focuses the app (by bundle id)
    ctrl-alt-b = 'exec-and-forget open -b com.brave.Browser'
    ctrl-alt-s = 'exec-and-forget open -b com.apple.Safari'
    ctrl-alt-o = 'exec-and-forget open -b app.clarity.mac' # Clarity (replaces Obsidian)
    ctrl-alt-t = 'exec-and-forget open -b com.mitchellh.ghostty'
    ctrl-alt-w = 'exec-and-forget open -b dev.warp.Warp-Stable'
    ctrl-alt-c = 'exec-and-forget open -b com.microsoft.VSCodeInsiders'
    ctrl-alt-a = 'exec-and-forget open -b com.anthropic.claudefordesktop'
    ctrl-alt-x = 'exec-and-forget open -b com.microsoft.Excel'
    ctrl-alt-e = 'exec-and-forget open -b com.microsoft.Outlook'
    ctrl-alt-h = 'exec-and-forget open -b net.whatsapp.WhatsApp'
    ctrl-alt-g = 'exec-and-forget open -b ru.keepcoder.Telegram'
    ctrl-alt-m = 'exec-and-forget open -b com.spotify.client'
    ctrl-alt-k = 'exec-and-forget open -b com.tinyspeck.slackmacgap' # Slack

[mode.launch.binding]
    # Leader key: tap Caps Lock (remapped to F18 by launchd/), then one letter. Esc or Caps Lock again cancels.
    b = ['exec-and-forget ~/dotfiles/aerospace/launch.sh browser', 'mode main']
    t = ['exec-and-forget ~/dotfiles/aerospace/launch.sh ghostty', 'mode main']
    n = ['exec-and-forget ~/dotfiles/aerospace/launch.sh new', 'mode main']
    f = ['exec-and-forget ~/dotfiles/aerospace/launch.sh finder', 'mode main']
    c = ['exec-and-forget ~/dotfiles/aerospace/launch.sh code', 'mode main']
    m = ['exec-and-forget ~/dotfiles/aerospace/launch.sh btop', 'mode main']
    l = ['exec-and-forget ~/dotfiles/aerospace/launch.sh lazygit', 'mode main']
    d = ['exec-and-forget ~/dotfiles/aerospace/launch.sh lazydocker', 'mode main']
    y = ['exec-and-forget ~/dotfiles/aerospace/launch.sh yazi', 'mode main']
    s = ['exec-and-forget ~/dotfiles/aerospace/launch.sh slack', 'mode main']
    w = ['exec-and-forget ~/dotfiles/aerospace/launch.sh whatsapp', 'mode main']
    o = ['exec-and-forget ~/dotfiles/aerospace/launch.sh notion', 'mode main']
    a = ['exec-and-forget ~/dotfiles/aerospace/launch.sh claude', 'mode main']
    e = ['exec-and-forget ~/dotfiles/aerospace/launch.sh outlook', 'mode main']
    x = ['exec-and-forget ~/dotfiles/aerospace/launch.sh excel', 'mode main']
    p = ['exec-and-forget ~/dotfiles/aerospace/launch.sh spotify', 'mode main']
    esc = 'mode main'
    f18 = 'mode main'

[mode.service.binding]
    esc = ['reload-config', 'mode main']
    r = ['flatten-workspace-tree', 'mode main', 'exec-and-forget /usr/local/bin/sketchybar --trigger aerospace_layout_change'] # reset layout
    f = ['layout floating tiling', 'mode main', 'exec-and-forget /usr/local/bin/sketchybar --trigger aerospace_layout_change'] # toggle floating/tiling
    # Shift guards the one destructive key against a stray backspace
    shift-backspace = ['close-all-windows-but-current', 'mode main']
    b = ['balance-sizes', 'mode main'] # equal sizes

    alt-shift-h = ['join-with left', 'mode main']
    alt-shift-j = ['join-with down', 'mode main']
    alt-shift-k = ['join-with up', 'mode main']
    alt-shift-l = ['join-with right', 'mode main']

# Resize mode: hold the arrows down, esc or enter to leave
[mode.resize.binding]
    h = 'resize width -50'
    l = 'resize width +50'
    k = 'resize height -50'
    j = 'resize height +50'
    left = 'resize width -50'
    right = 'resize width +50'
    up = 'resize height -50'
    down = 'resize height +50'
    b = ['balance-sizes', 'mode main']
    esc = 'mode main'
    enter = 'mode main'
