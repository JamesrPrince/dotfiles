<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>gruvbox-bar</title>
<!-- Minimal Zebar v2 widget, styled after the sketchybar Gruvbox theme (colours from sketchybar/colors.sh).
     Untested: written without a Windows machine. Provider output names follow the Zebar v2 docs. -->
<style>
  :root {
    --bar: rgba(40, 40, 40, 0.63);
    --pill: rgba(80, 73, 69, 0.56);
    --fg: #d4be98;
    --grey: #93856d;
    --accent: #7daea3;
    --green: #a9b665;
    --orange: #e1875c;
    --red: #ea6962;
    --bg: #282828;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: transparent; }
  body {
    font-family: "Maple Mono NF", monospace;
    font-size: 13px;
    color: var(--fg);
    overflow: hidden;
  }
  .bar {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    height: 100%;
    margin: 4px 8px 0;
    padding: 0 8px;
    background: var(--bar);
    border-radius: 8px;
  }
  .left, .right { display: flex; gap: 6px; align-items: center; }
  .right { justify-content: flex-end; }
  .ws, .item {
    padding: 2px 10px;
    border-radius: 6px;
    background: var(--pill);
    color: var(--grey);
    border: 0;
    font: inherit;
    cursor: pointer;
  }
  .ws.focused { background: var(--accent); color: var(--bg); }
  .ws.displayed:not(.focused) { color: var(--fg); }
  .item { cursor: default; color: var(--fg); }
  .item.warn { color: var(--orange); }
  .item.crit { color: var(--red); }
  .item.good { color: var(--green); }
</style>
</head>
<body>
<div class="bar">
  <div class="left" id="workspaces"></div>
  <div class="item" id="clock"></div>
  <div class="right">
    <div class="item" id="wifi"></div>
    <div class="item" id="battery"></div>
  </div>
</div>

<script type="module">
  import * as zebar from 'https://esm.sh/zebar@2';

  const providers = zebar.createProviderGroup({
    glazewm: { type: 'glazewm' },
    date: { type: 'date', formatting: 'EEE d MMM  HH:mm' },
    battery: { type: 'battery' },
    network: { type: 'network' },
  });

  const $ = (id) => document.getElementById(id);

  function render(out) {
    const { glazewm, date, battery, network } = out;

    if (glazewm) {
      const box = $('workspaces');
      box.replaceChildren();
      for (const ws of glazewm.currentWorkspaces) {
        const b = document.createElement('button');
        b.className = 'ws' + (ws.hasFocus ? ' focused' : '') + (ws.isDisplayed ? ' displayed' : '');
        b.textContent = ws.displayName ?? ws.name;
        b.onclick = () => glazewm.runCommand(`focus --workspace ${ws.name}`);
        box.appendChild(b);
      }
    }

    if (date) $('clock').textContent = date.formatted;

    if (network) {
      const iface = network.defaultInterface;
      const strength = network.defaultGateway?.signalStrength;
      $('wifi').textContent = !iface
        ? '󰤮 offline'
        : iface.type === 'wifi'
          ? `󰤨 ${strength ?? ''}%`
          : '󰈀 wired';
      $('wifi').className = 'item' + (iface ? '' : ' crit');
    }

    if (battery) {
      const pct = Math.round(battery.chargePercent);
      const cls = battery.isCharging ? 'good' : pct < 20 ? 'crit' : pct < 40 ? 'warn' : '';
      $('battery').textContent = `${battery.isCharging ? '󰂄' : '󰁹'} ${pct}%`;
      $('battery').className = 'item ' + cls;
    }
  }

  providers.onOutput(render);
</script>
</body>
</html>
