# GlazeWM config: the Windows counterpart of aerospace/aerospace.toml.
# bootstrap.ps1 links this to %USERPROFILE%\.glzr\glazewm\config.yaml (GlazeWM's default location).
#
# AeroSpace bindings that do NOT map (GlazeWM has no equivalent), and what was done:
#   - alt-slash / alt-shift-period (layout-cycle.sh), alt-comma (accordion): GlazeWM has tiling only,
#     no accordion layout. Dropped. alt+v (toggle-tiling-direction) is added as the nearest thing, but it
#     only sets which way the NEXT window splits from the focused one; it never re-orients windows already
#     open. To stack two open windows, move one with alt+shift+j/k (tested 2026-11-27).
#   - join-with (service mode alt-shift-hjkl): no join command. Dropped.
#   - flatten-workspace-tree, balance-sizes, close-all-windows-but-current: none. Dropped
#     (use wm-redraw on alt+shift+b for a re-tile).
#   - scratchpad send/bring (alt-shift-minus / alt-shift-equal): no scratchpad. alt+shift+minus
#     minimises the window instead (restore through alt+shift+equal is NOT possible, use the taskbar).
#   - alt-backtick / alt-shift-backtick (dfs-next / dfs-prev window cycling): no window-cycle command.
#     Dropped; alt+hjkl focus covers it.
#   - sketchybar triggers, theme.sh / barstyle.sh (alt-shift-t / alt-shift-b), keys.py cheat sheet,
#     om-key.sh (alt-space, ctrl-alt-space, ctrl-alt-c/o, alt-esc), claude-console.sh (alt-c):
#     macOS-only scripts. Dropped. alt+space is left to Flow Launcher.
#   - f18 launch mode (Caps Lock): the launch.sh app launcher is replaced by Flow Launcher (alt+space).
#   - Per-mode 3s/5s auto-return timeouts: GlazeWM binding modes have none; press esc to leave.
#   - ctrl-alt-v Maccy: use Windows clipboard history (win+v). App-launch keys ctrl-alt-b/s/w/a/x/e/h/g/m/k
#     are mapped only for apps likely to exist here (see the bottom).
#   - focus-follows-mouse is off, same as AeroSpace.
# Tested on Windows 11 (Boot Camp, GlazeWM 3.10.1) 2026-11-27: alt+hjkl focus, alt+shift+hjkl move,
# alt+1..7, alt+v, resize mode (alt+shift+r, then hjkl, esc), ctrl+` scratch, ctrl+alt+t, window rules.
# Key names: GlazeWM uses oem_tilde / oem_semicolon,
# not oem_3 / oem_1 (unknown key names are ignored without an error).

general:
  # Start the Zebar top bar with the window manager.
  startup_commands: ['shell-exec zebar']
  # Zebar has no "shutdown" subcommand; GlazeWM's own sample config kills it like this.
  shutdown_commands: ['shell-exec taskkill /IM zebar.exe /F']
  config_reload_commands: []
  focus_follows_cursor: false
  toggle_workspace_on_refocus: false
  cursor_jump:
    enabled: true
    trigger: 'window_focus'
  hide_method: 'cloak'
  show_all_in_taskbar: false

gaps:
  scale_with_dpi: true
  inner_gap: '8px'
  # Zebar docks as a Windows app bar (dockToEdge) and reserves its own 36px, which GlazeWM respects,
  # so the top gap is the same 8px as the other sides (36px here doubled the space; tested 2026-11-27).
  outer_gap:
    top: '8px'
    right: '8px'
    bottom: '8px'
    left: '8px'

window_effects:
  focused_window:
    border:
      enabled: true
      color: '#7daea3'   # Gruvbox accent (aqua-blue), as the sketchybar ACCENT
    hide_title_bar:
      enabled: false
    corner_style:
      enabled: false
  other_windows:
    border:
      enabled: true
      color: '#504945'   # Gruvbox bg2

window_behavior:
  initial_state: 'tiling'
  state_defaults:
    floating:
      centered: true
      shown_on_top: true
    fullscreen:
      maximized: false
      shown_on_top: false

workspaces:
  - name: '1'
    display_name: 'Web'
  - name: '2'
    display_name: 'Code'
  - name: '3'
    display_name: 'Notes'
  - name: '4'
    display_name: 'Office'
  - name: '5'
    display_name: 'Chat'
  - name: '6'
    display_name: 'Trade'
  - name: '7'
    display_name: 'Other'

window_rules:
  # Float the Windows system dialogs AeroSpace floats on the Mac.
  - commands: ['set-floating']
    match:
      - window_process: { regex: '^(SystemSettings|CalculatorApp|Calculator|Taskmgr|ApplicationFrameHost|mmc|control)$' }
  - commands: ['set-floating']
    match:
      - window_title: { regex: '(?i)(settings|preferences|picture.in.picture)$' }
  - commands: ['set-floating']
    match:
      - window_process: { equals: 'Obsidian' }
        window_title: { regex: '^Settings' }
  # ctrl+` scratch terminal: floating, launched by the binding below.
  # Matched on the window class (wezterm start --class scratch), which is set at creation; the title
  # is only set once the shell runs, too late for the workspace-2 rule below.
  - commands: ['set-floating --centered']
    match:
      - window_process: { equals: 'wezterm-gui' }
        window_class: { equals: 'scratch' }
  # Default workspaces (AeroSpace on-window-detected).
  - commands: ['move --workspace 1']
    match:
      - window_process: { regex: '^(chrome|msedge)$' }
  - commands: ['move --workspace 2']
    match:
      - window_process: { regex: '^(wezterm-gui|Code|claude)$' }
        window_class: { not_equals: 'scratch' }
  - commands: ['move --workspace 3']
    match:
      - window_process: { equals: 'Obsidian' }
  - commands: ['move --workspace 4']
    match:
      - window_process: { regex: '^(EXCEL|OUTLOOK|WINWORD|soffice)$' }
  - commands: ['move --workspace 6']
    match:
      # MetaTrader 5 (broker-installed): terminal64.exe by default.
      - window_process: { regex: '^(terminal64|metatrader64)$' }
  # Flow Launcher and the Windows taskbar-level popups should never be tiled.
  - commands: ['ignore']
    match:
      - window_process: { equals: 'Flow.Launcher' }
  # The Zebar bar itself (GlazeWM's default config has this; without it the bar is grabbed as an 800x600 float).
  - commands: ['ignore']
    match:
      - window_process: { equals: 'zebar' }

binding_modes:
  - name: 'resize'
    keybindings:
      - commands: ['resize --width -2%']
        bindings: ['h', 'left']
      - commands: ['resize --width +2%']
        bindings: ['l', 'right']
      - commands: ['resize --height +2%']
        bindings: ['k', 'up']
      - commands: ['resize --height -2%']
        bindings: ['j', 'down']
      - commands: ['wm-disable-binding-mode --name resize']
        bindings: ['escape', 'enter', 'alt+shift+r']

keybindings:
  # Focus (alt-hjkl)
  - commands: ['focus --direction left']
    bindings: ['alt+h']
  - commands: ['focus --direction down']
    bindings: ['alt+j']
  - commands: ['focus --direction up']
    bindings: ['alt+k']
  - commands: ['focus --direction right']
    bindings: ['alt+l']

  # Move (alt-shift-hjkl)
  - commands: ['move --direction left']
    bindings: ['alt+shift+h']
  - commands: ['move --direction down']
    bindings: ['alt+shift+j']
  - commands: ['move --direction up']
    bindings: ['alt+shift+k']
  - commands: ['move --direction right']
    bindings: ['alt+shift+l']

  # Swap (ctrl-alt-shift-hjkl): GlazeWM's move already swaps with a neighbour, so these mirror it.
  - commands: ['move --direction left']
    bindings: ['ctrl+alt+shift+h']
  - commands: ['move --direction down']
    bindings: ['ctrl+alt+shift+j']
  - commands: ['move --direction up']
    bindings: ['ctrl+alt+shift+k']
  - commands: ['move --direction right']
    bindings: ['ctrl+alt+shift+l']

  # Resize (alt-minus / alt-equal)
  - commands: ['resize --width -2%']
    bindings: ['alt+oem_minus']
  - commands: ['resize --width +2%']
    bindings: ['alt+oem_plus']

  # Close, fullscreen, float toggle
  - commands: ['close']
    bindings: ['alt+w']
  - commands: ['toggle-fullscreen']
    bindings: ['alt+f']
  - commands: ['toggle-floating --centered']
    bindings: ['alt+t']
  - commands: ['toggle-tiling-direction']
    bindings: ['alt+v']

  # alt-shift-minus (scratchpad send): nearest equivalent
  - commands: ['toggle-minimized']
    bindings: ['alt+shift+oem_minus']

  # Modes and housekeeping
  - commands: ['wm-enable-binding-mode --name resize']
    bindings: ['alt+shift+r']
  - commands: ['wm-reload-config']
    # alt-shift-; (AeroSpace service mode reload). GlazeWM names OEM keys by symbol (oem_semicolon,
    # oem_tilde); VK-number names like oem_1/oem_3 are silently ignored.
    bindings: ['alt+shift+oem_semicolon']
  - commands: ['wm-redraw']
    bindings: ['alt+shift+b']
  - commands: ['wm-toggle-pause']
    bindings: ['alt+shift+p']

  # Workspaces (alt-1..7), move window (alt-shift-1..7), move and follow (ctrl-alt-shift-1..7)
  - commands: ['focus --workspace 1']
    bindings: ['alt+1']
  - commands: ['focus --workspace 2']
    bindings: ['alt+2']
  - commands: ['focus --workspace 3']
    bindings: ['alt+3']
  - commands: ['focus --workspace 4']
    bindings: ['alt+4']
  - commands: ['focus --workspace 5']
    bindings: ['alt+5']
  - commands: ['focus --workspace 6']
    bindings: ['alt+6']
  - commands: ['focus --workspace 7']
    bindings: ['alt+7']
  - commands: ['move --workspace 1']
    bindings: ['alt+shift+1']
  - commands: ['move --workspace 2']
    bindings: ['alt+shift+2']
  - commands: ['move --workspace 3']
    bindings: ['alt+shift+3']
  - commands: ['move --workspace 4']
    bindings: ['alt+shift+4']
  - commands: ['move --workspace 5']
    bindings: ['alt+shift+5']
  - commands: ['move --workspace 6']
    bindings: ['alt+shift+6']
  - commands: ['move --workspace 7']
    bindings: ['alt+shift+7']
  - commands: ['move --workspace 1', 'focus --workspace 1']
    bindings: ['ctrl+alt+shift+1']
  - commands: ['move --workspace 2', 'focus --workspace 2']
    bindings: ['ctrl+alt+shift+2']
  - commands: ['move --workspace 3', 'focus --workspace 3']
    bindings: ['ctrl+alt+shift+3']
  - commands: ['move --workspace 4', 'focus --workspace 4']
    bindings: ['ctrl+alt+shift+4']
  - commands: ['move --workspace 5', 'focus --workspace 5']
    bindings: ['ctrl+alt+shift+5']
  - commands: ['move --workspace 6', 'focus --workspace 6']
    bindings: ['ctrl+alt+shift+6']
  - commands: ['move --workspace 7', 'focus --workspace 7']
    bindings: ['ctrl+alt+shift+7']
  # alt-tab (workspace-back-and-forth). May fight Windows' own alt+tab; remap if it does.
  - commands: ['focus --workspace recent']
    bindings: ['alt+tab']

  # ctrl+` drop-down terminal. WezTerm has no quick terminal, so this opens a floating WezTerm window
  # titled "scratch" (floated by the window rule above). Press alt+w to close it.
  - commands: ['shell-exec wezterm-gui start --class scratch']
    bindings: ['ctrl+oem_tilde']

  # App launch keys (ctrl-alt-t Ghostty -> WezTerm, ctrl-alt-b browser, ctrl-alt-a Claude, ctrl-alt-x Excel)
  - commands: ['shell-exec wezterm-gui']
    bindings: ['ctrl+alt+t']
  - commands: ['shell-exec cmd /c start chrome']
    bindings: ['ctrl+alt+b']
  - commands: ['shell-exec cmd /c start obsidian://open']
    bindings: ['ctrl+alt+o']
  - commands: ['shell-exec cmd /c start excel']
    bindings: ['ctrl+alt+x']
